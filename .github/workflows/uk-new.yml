name: uk-new
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 8 * *"
permissions:
  contents: write
concurrency: uk-new
jobs:
  companies-house:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest monthly snapshot
        run: |
          ua="ScanAxe-open-data (github.com/Qafila-Robotics/scanaxe-open-data)"
          curl -sSfL --retry 6 --retry-delay 60 --retry-all-errors -A "$ua" -o /tmp/page.html https://download.companieshouse.gov.uk/en_output.html
          file=$(grep -oE 'BasicCompanyDataAsOneFile-[0-9]{4}-[0-9]{2}-[0-9]{2}\.zip' /tmp/page.html | sort -u | tail -1)
          test -n "$file" || { echo "No single-file snapshot listed"; exit 1; }
          echo "DAY=$(echo "$file" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')" >> "$GITHUB_ENV"
          curl -sSfL --retry 6 --retry-delay 60 --retry-all-errors -A "$ua" -o /tmp/ch.zip "https://download.companieshouse.gov.uk/$file"
          unzip -o -q /tmp/ch.zip -d /tmp/ch && ls -lh /tmp/ch
      - run: mkdir -p data/new-companies && python3 scripts/uk_new_companies.py /tmp/ch/*.csv data/new-companies/GB.tsv.gz "$DAY"
      - name: Commit
        run: |
          git config user.name "Hassan Najjar"; git config user.email "$(git log -1 --format=%ae)"
          git add data/new-companies && git commit -qm "New UK companies from the Companies House snapshot of $DAY" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 20; done
