name: commit-run
# Commits the data files a finished world run left as artifacts (when its own commit step lost a push race).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "World run id"
        required: true
permissions:
  contents: write
  actions: read
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: art
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Commit
        run: bash scripts/commit_data.sh art
